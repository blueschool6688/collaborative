services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: synccraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: collaborative_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. Redis Pub/Sub Cluster Coordinator
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: synccraft_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # 3. Backend API & Hocuspocus CRDT Server
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synccraft_server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/collaborative_db?schema=public"
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
      JWT_SECRET: "synccraft-super-secret-jwt-key-2026-production"
      CLIENT_URL: "http://localhost:80"
      SERVER_URL: "http://localhost:4000"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================================
  # 4. Frontend Client (Nginx Static + Reverse Proxy)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: synccraft_client
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  postgres_data:
  redis_data:
