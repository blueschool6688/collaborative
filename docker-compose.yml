services:
  # ==========================================
  # 1. PostgreSQL Database
  # ==========================================
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: synccraft_postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgrespassword
  #     POSTGRES_DB: collaborative_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  # ==========================================
  # 2. Redis Pub/Sub Cluster Coordinator
  # ==========================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: synccraft_redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

  server_sync_craft:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synccraft_server
    restart: unless-stopped
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  client_sync_craft:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: synccraft_client
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
    depends_on:
      - server

