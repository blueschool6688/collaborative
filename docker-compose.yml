services:
  server:
    image: blueschool6688/synccraft-server:latest
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synccraft_server
    restart: unless-stopped
    env_file: ./server/.env.docker
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  client:
    image: blueschool6688/synccraft-client:latest
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: synccraft_client
    restart: unless-stopped
    env_file: ./client/.env.docker
    ports:
      - "3000:80"
    depends_on:
      - server
