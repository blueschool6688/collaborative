services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: synccraft_server
    restart: unless-stopped
    env_file: ./server/.env.docker
    ports:
      - "4000:4000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: synccraft_client
    restart: unless-stopped
    env_file: ./client/.env.docker
    ports:
      - "80:80"
    depends_on:
      - server
